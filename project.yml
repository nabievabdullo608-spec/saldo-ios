name: Saldo
options:
  bundleIdPrefix: com.saldo
  deploymentTarget:
    iOS: "16.0"
targets:
  Saldo:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Saldo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.saldo.debttracker
